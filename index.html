<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Royal Games Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Roboto',sans-serif;background:#0b0f1a;color:#fff}
.header{background:linear-gradient(90deg,#111827,#1e293b);padding:25px 15px;text-align:center;border-bottom:4px solid gold}
.header h1{margin:0;font-family:'Orbitron',sans-serif;color:gold;font-size:36px;letter-spacing:3px}
.section{padding:20px 15px}
.card{background:#111827;border-radius:20px;padding:20px;margin:20px auto;max-width:800px;box-shadow:0 0 20px rgba(0,255,255,.1);transition:.3s}
.card:hover{transform:translateY(-5px);box-shadow:0 0 25px rgba(0,255,255,.3)}
.card h2{font-family:'Orbitron',sans-serif;color:#0ea5e9;margin-bottom:15px}
input, select, button{padding:12px;margin:6px 0;border-radius:12px;border:none;font-size:16px}
input, select{width:95%;background:#1f2937;color:#fff}
button{background:#25D366;color:#fff;font-weight:bold;cursor:pointer;transition:.3s}
button:hover{background:#1ebe57}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #333}
th{background:#1f2937}
.result-box{background:#22c55e;color:#0b0f1a;font-weight:bold;padding:12px;border-radius:12px;margin-top:10px}
</style>
</head>
<body>

<div class="header">
    <h1>👑 ROYAL GAMES ADMIN</h1>
</div>

<div class="section">
    <div class="card center">
        <h2>Password Login</h2>
        <input type="password" id="adminPassword" placeholder="Enter password">
        <button onclick="checkPassword()">Login</button>
    </div>
</div>

<div id="tracker" style="display:none;">

    <!-- Income Cards -->
    <div class="section">
        <div class="card">
            <h2>Daily Income</h2>
            <input type="date" id="dailyDate">
            <button onclick="calculateDaily()">Calculate Daily Income</button>
            <div id="dailyResult" class="result-box"></div>
        </div>

        <div class="card">
            <h2>Monthly Income</h2>
            <input type="month" id="monthlyDate">
            <button onclick="calculateMonthly()">Calculate Monthly Income</button>
            <div id="monthlyResult" class="result-box"></div>
        </div>

        <div class="card">
            <h2>Yearly Income</h2>
            <input type="number" id="yearlyDate" placeholder="YYYY">
            <button onclick="calculateYearly()">Calculate Yearly Income</button>
            <div id="yearlyResult" class="result-box"></div>
        </div>
    </div>

    <!-- All Bookings -->
    <div class="section">
        <div class="card">
            <h2>All Bookings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Console</th>
                        <th>Days</th>
                        <th>Final Price (₹)</th>
                        <th>Coupon</th>
                    </tr>
                </thead>
                <tbody id="allBookingsTable"></tbody>
            </table>
        </div>
    </div>

    <!-- Monthly Filter -->
    <div class="section">
        <div class="card">
            <h2>Bookings by Month</h2>
            <input type="month" id="filterMonth">
            <button onclick="filterMonthlyBookings()">Show Bookings</button>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Console</th>
                        <th>Days</th>
                        <th>Final Price (₹)</th>
                        <th>Coupon</th>
                    </tr>
                </thead>
                <tbody id="monthlyBookingsTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const PASSWORD = "YUVRAJ0011"; // change your password

// Firebase config
const firebaseConfig = {
  databaseURL: "https://royalgamesproject-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let bookings = [];

function checkPassword(){
    const input = document.getElementById('adminPassword').value;
    if(input===PASSWORD){
        document.getElementById('tracker').style.display='block';
        loadBookings();
    } else {
        alert("Wrong password!");
    }
}

async function loadBookings(){
    const snapshot = await fetch(firebaseConfig.databaseURL+'/bookings.json');
    const data = await snapshot.json();
    bookings = data? Object.values(data) : [];
    displayAllBookings();
}

function displayAllBookings(){
    const tbody = document.getElementById('allBookingsTable');
    tbody.innerHTML="";
    bookings.forEach(b=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${b.startDate}</td><td>${b.name}</td><td>${b.console}</td>
        <td>${b.days}</td><td>${b.finalPrice}</td><td>${b.coupon}</td>`;
        tbody.appendChild(tr);
    });
}

function calculateDaily(){
    const date=document.getElementById('dailyDate').value;
    const total = bookings.filter(b=>b.startDate===date)
                          .reduce((sum,b)=>sum+Number(b.finalPrice),0);
    document.getElementById('dailyResult').innerText=`Daily Income (${date}): ₹${total}`;
}

function calculateMonthly(){
    const month=document.getElementById('monthlyDate').value; // YYYY-MM
    const total = bookings.filter(b=>b.startDate.startsWith(month))
                          .reduce((sum,b)=>sum+Number(b.finalPrice),0);
    document.getElementById('monthlyResult').innerText=`Monthly Income (${month}): ₹${total}`;
}

function calculateYearly(){
    const year=document.getElementById('yearlyDate').value;
    const total = bookings.filter(b=>b.startDate.startsWith(year))
                          .reduce((sum,b)=>sum+Number(b.finalPrice),0);
    document.getElementById('yearlyResult').innerText=`Yearly Income (${year}): ₹${total}`;
}

// Monthly Filter Table
function filterMonthlyBookings(){
    const month=document.getElementById('filterMonth').value;
    const tbody=document.getElementById('monthlyBookingsTable');
    tbody.innerHTML="";
    bookings.filter(b=>b.startDate.startsWith(month))
            .forEach(b=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${b.startDate}</td><td>${b.name}</td><td>${b.console}</td>
        <td>${b.days}</td><td>${b.finalPrice}</td><td>${b.coupon}</td>`;
        tbody.appendChild(tr);
    });
}
</script>
</body>
</html>

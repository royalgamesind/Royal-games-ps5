<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Games Winner Card 💌</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #0b0b0f, #1a1a24);
  font-family: 'Arial', sans-serif;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

h1 {
  text-align:center;
  text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
  margin-bottom: 10px;
}

input, button {
  padding: 12px;
  margin: 5px;
  border-radius: 8px;
  border: none;
  font-weight: bold;
  font-size: 16px;
}

button {
  cursor: pointer;
  background: #ff4500;
  color: #fff;
  text-shadow: 0 0 5px #000;
}

/* Card container */
#card-container {
  width: 280px;
  height: 160px;
  perspective: 1000px;
  margin-top: 20px;
  display: none;
}

/* Card */
#card {
  width: 100%;
  height: 100%;
  background: #111;
  border-radius: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #0ff;
  font-weight: bold;
  font-size: 20px;
  text-align: center;
  cursor: pointer;
  transition: transform 1s;
  transform-style: preserve-3d;
  box-shadow: 0 0 20px #0ff, 0 0 40px #0ff inset;
}

/* Card back */
#card .back {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #fff;
  color: #0b0b0f;
  transform: rotateY(180deg);
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  font-size: 18px;
  text-align: center;
  border-radius: 12px;
  text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
}

/* Flip card */
.flipped {
  transform: rotateY(180deg);
}

/* Confetti */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #ff0;
  border-radius: 50%;
  animation: fall 1.5s linear forwards;
  opacity: 0.9;
}
@keyframes fall {
  0% {transform: translateY(0) rotate(0deg);}
  100% {transform: translateY(350px) rotate(720deg); opacity: 0;}
}
</style>
</head>
<body>

<h1>🎮 Royal Games Winner Card 💌</h1>
<p>Enter your winner password:</p>
<input type="text" id="winnerCode" placeholder="Enter password">
<button onclick="showCard()">Reveal Card</button>

<div id="card-container">
  <div id="card">
    <div class="front">Tap to Reveal Your Prize 🎉</div>
    <div class="back" id="card-back"></div>
  </div>
</div>

<script>
// Winner data
const winners = {
  "WINNER10": { prize:"🥇 1 Day PS5 Rental FREE", code:"CONGRATS100" },
  "WINNER02": { prize:"🥈 50% OFF", code:"CONGRATS50" },
  "WINNER45": { prize:"🥉 40% OFF", code:"CONGRATS40" }
};

const card = document.getElementById('card');
const cardBack = document.getElementById('card-back');
const cardContainer = document.getElementById('card-container');

function showCard() {
  const code = document.getElementById('winnerCode').value.trim().toUpperCase();
  if(winners[code]){
    const winner = winners[code];
    cardBack.innerHTML = `${winner.prize}<br>Coupon: ${winner.code}<br>Valid for 1-day rental only`;
    cardContainer.style.display = "block";
    card.classList.remove("flipped");
    setTimeout(()=> {
      card.classList.add("flipped");
      createConfetti();
    }, 200); // small delay before flip
  } else {
    alert("❌ Invalid password! Only winners can reveal the card.");
  }
}

// Confetti generator
function createConfetti(){
  for(let i=0;i<40;i++){
    const conf = document.createElement('div');
    conf.classList.add('confetti');
    conf.style.background = randomColor();
    conf.style.left = Math.random()*window.innerWidth + "px";
    conf.style.top = "0px";
    conf.style.width = conf.style.height = Math.random()*8 + 6 + "px";
    document.body.appendChild(conf);
    setTimeout(()=> conf.remove(),1600);
  }
}

function randomColor(){
  const colors = ['#ff0','#ff4500','#0ff','#f0f','#0f0','#fff'];
  return colors[Math.floor(Math.random()*colors.length)];
}

// Make card clickable to flip manually (optional)
card.addEventListener("click", ()=>{
  card.classList.toggle("flipped");
  createConfetti();
});
</script>

</body>
</html>

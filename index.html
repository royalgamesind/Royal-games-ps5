<script>

/******** FIREBASE ********/
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/******** LOGIN ********/
function checkPassword(){
if(document.getElementById("adminPass").value==="Royal@2026"){
document.getElementById("loginBox").style.display="none";
loadRecent();
tenDays();
populateSelectors();
}else{
document.getElementById("loginError").innerText="Wrong Password";
}
}

/******** STATUS SYSTEM ********/
function getStatus(d){
if(d.status==="Cancelled") return "Cancelled";

if(!d.startDate || !d.days) return "Active";

let start=new Date(d.startDate);
let end=new Date(start);
end.setDate(start.getDate()+Number(d.days));

let today=new Date();

if(today > end){
return "Completed";
}else{
return "Active";
}
}

/******** TABLE ROW ********/
function rowHTML(id,d){
let status=getStatus(d);

return `<tr>
<td>${id}</td>
<td>${d.name||''}</td>
<td>${d.phone||''}</td>
<td>${d.console||''}</td>
<td>${d.startDate||''}</td>
<td>${d.days||''}</td>
<td>₹${d.finalPrice||0}</td>
<td>${status}</td>
<td>
${status==="Cancelled" ? "" :
`<button class="danger" onclick="cancelBooking('${id}')">Cancel</button>`}
</td>
</tr>`;
}

/******** RECENT ********/
function loadRecent(){
db.ref("bookings").limitToLast(5).on("value",snap=>{
let html=`<tr>
<th>ID</th><th>Name</th><th>Phone</th>
<th>Console</th><th>Date</th><th>Days</th>
<th>Final</th><th>Status</th><th>Action</th></tr>`;
snap.forEach(c=>{html+=rowHTML(c.key,c.val());});
document.getElementById("recentTable").innerHTML=html;
});
}

/******** SEARCH ********/
function searchBooking(){
let val=document.getElementById("searchBox").value.toLowerCase();
db.ref("bookings").once("value",snap=>{
let html=`<tr>
<th>ID</th><th>Name</th><th>Phone</th>
<th>Console</th><th>Date</th><th>Days</th>
<th>Final</th><th>Status</th><th>Action</th></tr>`;
snap.forEach(c=>{
let d=c.val();
if(c.key.toLowerCase().includes(val)||
(d.name||"").toLowerCase().includes(val)){
html+=rowHTML(c.key,d);
}
});
document.getElementById("searchTable").innerHTML=html;
});
}

/******** CANCEL ********/
function cancelBooking(id){
if(confirm("Cancel booking?")){
db.ref("bookings/"+id).update({
status:"Cancelled",
cancelTime:Date.now()
});
}
}

/******** 10 DAYS ********/
function tenDays(){
let total=0,count=0,cancelled=0;
let today=new Date();

db.ref("bookings").once("value",snap=>{
snap.forEach(c=>{
let d=c.val();
let status=getStatus(d);

if(status==="Cancelled"){
cancelled++;
return;
}

if(!d.startDate) return;

let bd=new Date(d.startDate);
let diff=(today-bd)/(1000*60*60*24);

if(diff<=10){
total+=Number(d.finalPrice||0);
count++;
}
});

document.getElementById("tenDaysData").innerHTML=
`Total Bookings: ${count}<br>
Cancelled: ${cancelled}<br>
Total Earnings: ₹${total}`;
});
}

/******** SELECTORS ********/
function populateSelectors(){
for(let m=1;m<=12;m++){
document.getElementById("monthSelect").innerHTML+=
`<option value="${m}">${m}</option>`;
}
let currentYear=new Date().getFullYear();
for(let y=currentYear;y>=2023;y--){
document.getElementById("yearSelect").innerHTML+=
`<option>${y}</option>`;
document.getElementById("yearOnlySelect").innerHTML+=
`<option>${y}</option>`;
}
}

/******** MONTHLY ********/
function calculateMonthly(){
let m=document.getElementById("monthSelect").value;
let y=document.getElementById("yearSelect").value;
let total=0,count=0,cancelled=0;

db.ref("bookings").once("value",snap=>{
snap.forEach(c=>{
let d=c.val();
let status=getStatus(d);

if(!d.startDate) return;
let bd=new Date(d.startDate);

if((bd.getMonth()+1)==m && bd.getFullYear()==y){

if(status==="Cancelled"){
cancelled++;
}else{
total+=Number(d.finalPrice||0);
count++;
}
}
});

document.getElementById("monthlyResult").innerHTML=
`Total Bookings: ${count}<br>
Cancelled: ${cancelled}<br>
Total Revenue: ₹${total}`;
});
}

/******** YEARLY ********/
function calculateYearly(){
let y=document.getElementById("yearOnlySelect").value;
let total=0,count=0,cancelled=0;

db.ref("bookings").once("value",snap=>{
snap.forEach(c=>{
let d=c.val();
let status=getStatus(d);

if(!d.startDate) return;
let bd=new Date(d.startDate);

if(bd.getFullYear()==y){

if(status==="Cancelled"){
cancelled++;
}else{
total+=Number(d.finalPrice||0);
count++;
}
}
});

document.getElementById("yearlyResult").innerHTML=
`Total Bookings: ${count}<br>
Cancelled: ${cancelled}<br>
Total Revenue: ₹${total}`;
});
}

  </script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Royal Games Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;background:#111;color:#fff;margin:0;padding:20px}
h1,h2{margin-top:25px}
.card{background:#1e1e1e;padding:12px;border-radius:12px;margin:10px 0}
input,button{border-radius:8px;border:1px solid #444}
input{padding:10px;background:#222;color:#fff}
button{padding:10px 14px;background:#4CAF50;color:#fff;border:none;cursor:pointer}
button.danger{background:#e53935}
#loginBox{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
#loginBox .inner{background:#1e1e1e;padding:25px;border-radius:14px;text-align:center}
.ai-box{background:#0d0d0d;padding:15px;border-radius:14px;margin-top:15px}
</style>
</head>
<body>

<div id="loginBox">
<div class="inner">
<h2>Admin Login</h2>
<input type="password" id="adminPass" placeholder="Enter Password"/>
<br/><br/>
<button onclick="checkPassword()">Enter</button>
<p id="loginError" style="color:#ff5252"></p>
</div>
</div>

<h1>Royal Games Booking Dashboard</h1>

<h2>Check Booking</h2>
<input type="text" id="searchBox" placeholder="Enter Name or Booking ID"/>
<button onclick="searchBooking()">Search</button>
<div id="searchResult"></div>

<h2>All Bookings</h2>
<div id="bookingList"></div>

<h2>Repeat Customers (VIP)</h2>
<div id="repeatCustomers"></div>

<h2>Bookings Last 10 Days</h2>
<canvas id="bookingChart" style="max-width:700px"></canvas>

<h2>🤖 Royal Games AI Business Brain</h2>
<div class="ai-box">
<input type="text" id="aiQuestion" placeholder="Ask about growth, profit, marketing, upgrade..." style="width:70%">
<button onclick="askAI()">Ask AI</button>
<div id="aiAnswer" style="margin-top:15px"></div>
</div>

<script>

const firebaseConfig = {
apiKey: "AIzaSyBRuy9084wz4HwBJbdNuleC4suYi0zycNA",
authDomain: "royalgamesproject.firebaseapp.com",
databaseURL: "https://royalgamesproject-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "royalgamesproject",
storageBucket: "royalgamesproject.firebasestorage.app",
messagingSenderId: "1008609758558",
appId: "1:1008609758558:web:7aa12cdef2b066ad7393cf"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

function checkPassword(){
if(document.getElementById('adminPass').value==='YUVRAJ01'){
document.getElementById('loginBox').style.display='none';
loadBookings();
detectCustomers();
bookingGraph();
}else{
document.getElementById('loginError').innerText='Wrong Password';
}
}

function loadBookings(){
db.ref('bookings').on('value',snap=>{
let html='';
snap.forEach(child=>{
let d=child.val(); let id=child.key;
html+=`<div class="card">
<b>ID:</b> ${id}<br>
<b>Name:</b> ${d.name}<br>
<b>Phone:</b> ${d.phone}<br>
<b>Date:</b> ${d.date}<br>
<b>Time:</b> ${d.time}<br>
<b>Price:</b> ₹${d.price}<br><br>
<button class="danger" onclick="cancelBooking('${id}')">Cancel Booking</button>
</div>`;
});
document.getElementById('bookingList').innerHTML=html||'<p>No bookings yet</p>';
});
}

function cancelBooking(id){
if(confirm('Cancel booking?')){
db.ref('bookings/'+id).remove();
}
}

function searchBooking(){
const value=document.getElementById('searchBox').value.toLowerCase();
db.ref('bookings').once('value',snapshot=>{
let html=''; let found=false;
snapshot.forEach(child=>{
let d=child.val(); let id=child.key;
if(id.toLowerCase().includes(value)||d.name.toLowerCase().includes(value)){
found=true;
html+=`<div class="card">
<b>ID:</b> ${id}<br>
<b>Name:</b> ${d.name}<br>
<b>Phone:</b> ${d.phone}<br>
<b>Date:</b> ${d.date}<br>
<b>Price:</b> ₹${d.price}
</div>`;
}
});
document.getElementById('searchResult').innerHTML=found?html:"No booking found";
});
}

function detectCustomers(){
let customers={};
db.ref('bookings').once('value',snapshot=>{
snapshot.forEach(child=>{
let d=child.val();
customers[d.phone]?customers[d.phone]++:customers[d.phone]=1;
});
let html='';
for(let p in customers){
if(customers[p]>1){
html+=`<div class="card">${p} - Bookings: ${customers[p]}</div>`;
}
}
document.getElementById('repeatCustomers').innerHTML=html||'No repeat customers';
});
}

function bookingGraph(){
let days={};
let today=new Date();
for(let i=9;i>=0;i--){
let d=new Date();
d.setDate(today.getDate()-i);
days[d.toLocaleDateString()]=0;
}
db.ref('bookings').once('value',snapshot=>{
snapshot.forEach(child=>{
let data=child.val();
if(days[data.date]!==undefined) days[data.date]++;
});
new Chart(document.getElementById('bookingChart'),{
type:'line',
data:{labels:Object.keys(days),
datasets:[{label:'Bookings',data:Object.values(days),borderWidth:3}]}
});
});
}

function askAI(){

const question=document.getElementById('aiQuestion').value.toLowerCase();
const answerDiv=document.getElementById('aiAnswer');
answerDiv.innerHTML="Analyzing business intelligence...";

db.ref('bookings').once('value',snapshot=>{

let totalBookings=0;
let totalRevenue=0;
let days={};
let customers={};

snapshot.forEach(child=>{
let d=child.val();
totalBookings++;
totalRevenue+=Number(d.price||0);
days[d.date]?days[d.date]++:days[d.date]=1;
customers[d.phone]?customers[d.phone]++:customers[d.phone]=1;
});

let repeatCount=0;
for(let p in customers){ if(customers[p]>1) repeatCount++; }

let repeatRatio=totalBookings?((repeatCount/totalBookings)*100).toFixed(1):0;

let values=Object.values(days);
let recent=values.slice(-5);
let old=values.slice(0,5);

let recentAvg=recent.length?recent.reduce((a,b)=>a+b)/recent.length:0;
let oldAvg=old.length?old.reduce((a,b)=>a+b)/old.length:0;

let growth=oldAvg?(((recentAvg-oldAvg)/oldAvg)*100).toFixed(1):0;

let healthScore=0;
if(growth>10) healthScore+=40;
else if(growth>0) healthScore+=25;
if(repeatRatio>30) healthScore+=30;
else if(repeatRatio>10) healthScore+=15;
if(totalRevenue>50000) healthScore+=30;
else if(totalRevenue>20000) healthScore+=20;
if(healthScore>100) healthScore=100;

let response=`📊 Report<br>
Total Bookings: ${totalBookings}<br>
Revenue: ₹${totalRevenue}<br>
Growth: ${growth}%<br>
Repeat Ratio: ${repeatRatio}%<br>
Health Score: ${healthScore}/100<br><br>`;

if(question.includes("growth")){
response+=growth>10?"🔥 Strong growth. Expand soon.":"⚠️ Improve marketing.";
}
else if(question.includes("profit")){
response+=totalRevenue>50000?"💰 Good profit. Control expenses.":"📈 Increase price slightly.";
}
else if(question.includes("upgrade")){
response+=healthScore>70?"🚀 Good time to upgrade.":"⏳ Wait and grow more.";
}
else if(question.includes("marketing")){
response+="📢 Try Instagram reels, tournaments, loyalty cards.";
}
else{
response+="💡 Focus on repeat customers and weekend offers.";
}

answerDiv.innerHTML=response;

});
}

</script>
</body>
</html>

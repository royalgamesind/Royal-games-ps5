<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Games Admin</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0b0f1a;color:#fff;padding:20px}
h1{color:gold}
.card{background:#111827;padding:15px;border-radius:15px;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #333;text-align:left;font-size:14px}
th{color:#38bdf8}
button{padding:6px 10px;border:none;border-radius:8px;cursor:pointer}
.danger{background:#e53935;color:#fff}
.scroll{max-height:300px;overflow-y:auto}
select,input{padding:6px;border-radius:8px;border:none;margin:5px 0}
#loginBox{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
#loginBox div{background:#111827;padding:25px;border-radius:15px;text-align:center}
</style>
</head>
<body>

<div id="loginBox">
<div>
<h2>Admin Login</h2>
<input type="password" id="pass" placeholder="Enter Password"><br><br>
<button onclick="login()">Enter</button>
<p id="err" style="color:red"></p>
</div>
</div>

<h1>👑 Royal Games Admin</h1>

<!-- SEARCH -->
<div class="card">
<h2>Search Booking</h2>
<input type="text" id="searchInput" placeholder="Name or ID">
<button onclick="searchBooking()">Search</button>
<div class="scroll">
<table>
<thead>
<tr>
<th>ID</th><th>Name</th><th>Phone</th><th>Console</th>
<th>Date</th><th>Days</th><th>Final ₹</th><th>Action</th>
</tr>
</thead>
<tbody id="searchResult"></tbody>
</table>
</div>
</div>

<!-- RECENT 5 -->
<div class="card">
<h2>Recent 5 Bookings</h2>
<div class="scroll">
<table>
<thead>
<tr>
<th>ID</th><th>Name</th><th>Phone</th><th>Console</th>
<th>Date</th><th>Days</th><th>Final ₹</th><th>Action</th>
</tr>
</thead>
<tbody id="recentTable"></tbody>
</table>
</div>
</div>

<!-- 10 DAY PERFORMANCE -->
<div class="card">
<h2>Last 10 Days Performance</h2>
<div id="tenDaysData"></div>
</div>

<!-- MONTHLY -->
<div class="card">
<h2>Monthly Performance</h2>
<input type="month" id="monthSelect" onchange="monthlyCalc()">
<div id="monthlyResult"></div>
</div>

<!-- YEARLY -->
<div class="card">
<h2>Yearly Performance</h2>
<select id="yearSelect" onchange="yearlyCalc()"></select>
<div id="yearlyResult"></div>
</div>

<script>
const firebaseConfig={
databaseURL:"https://royalgamesproject-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();

function login(){
if(document.getElementById("pass").value==="YUVRAJ01"){
document.getElementById("loginBox").style.display="none";
loadRecent();
loadYears();
tenDays();
}else{
document.getElementById("err").innerText="Wrong Password";
}
}

function cancelBooking(id){
if(confirm("Cancel booking?")){
db.ref("bookings/"+id).remove();
}
}

function searchBooking(){
let val=document.getElementById("searchInput").value.toLowerCase();
db.ref("bookings").once("value",snap=>{
let html="";
snap.forEach(c=>{
let d=c.val();
if(c.key.toLowerCase().includes(val) || d.name.toLowerCase().includes(val)){
html+=row(c.key,d);
}
});
document.getElementById("searchResult").innerHTML=html||"<tr><td colspan='8'>No Result</td></tr>";
});
}

function loadRecent(){
db.ref("bookings").limitToLast(5).on("value",snap=>{
let html="";
snap.forEach(c=>{
html=row(c.key,c.val())+html;
});
document.getElementById("recentTable").innerHTML=html;
});
}

function row(id,d){
return `<tr>
<td>${id}</td>
<td>${d.name}</td>
<td>${d.phone}</td>
<td>${d.console}</td>
<td>${d.startDate}</td>
<td>${d.days}</td>
<td>${d.finalPrice}</td>
<td><button class='danger' onclick="cancelBooking('${id}')">Cancel</button></td>
</tr>`;
}

function tenDays(){
db.ref("bookings").once("value",snap=>{
let today=new Date();
let total=0,count=0;
snap.forEach(c=>{
let d=c.val();
let date=new Date(d.startDate);
let diff=(today-date)/(1000*60*60*24);
if(diff<=10){
total+=Number(d.finalPrice||0);
count++;
}
});
document.getElementById("tenDaysData").innerHTML=
`Bookings: ${count}<br>Total Earned: ₹${total}`;
});
}

function monthlyCalc(){
let month=document.getElementById("monthSelect").value;
if(!month) return;
db.ref("bookings").once("value",snap=>{
let total=0,count=0;
snap.forEach(c=>{
let d=c.val();
if(d.startDate && d.startDate.startsWith(month)){
total+=Number(d.finalPrice||0);
count++;
}
});
document.getElementById("monthlyResult").innerHTML=
`Total Bookings: ${count}<br>Total Revenue: ₹${total}`;
});
}

function loadYears(){
let currentYear=new Date().getFullYear();
let select=document.getElementById("yearSelect");
for(let y=currentYear;y>=2023;y--){
let opt=document.createElement("option");
opt.value=y;
opt.innerText=y;
select.appendChild(opt);
}
}

function yearlyCalc(){
let year=document.getElementById("yearSelect").value;
db.ref("bookings").once("value",snap=>{
let total=0,count=0;
snap.forEach(c=>{
let d=c.val();
if(d.startDate && d.startDate.startsWith(year)){
total+=Number(d.finalPrice||0);
count++;
}
});
document.getElementById("yearlyResult").innerHTML=
`Total Bookings: ${count}<br>Total Revenue: ₹${total}`;
});
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Games Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{font-family:Arial;background:#111;color:#fff;margin:0;padding:20px}
h1,h2{margin-top:30px}
.card{background:#1e1e1e;padding:15px;border-radius:12px;margin:15px 0}
input,button{padding:8px;border-radius:6px;border:none}
input{background:#222;color:#fff}
button{background:#4CAF50;color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #333;text-align:left}
.scroll-box{max-height:250px;overflow-y:auto}
.hidden{display:none}
#loginBox{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
#loginBox .inner{background:#1e1e1e;padding:30px;border-radius:14px;text-align:center}
</style>
</head>
<body>

<div id="loginBox">
<div class="inner">
<h2>Admin Login</h2>
<input type="password" id="adminPass" placeholder="Enter Password">
<br><br>
<button onclick="checkPassword()">Enter</button>
<p id="loginError" style="color:red"></p>
</div>
</div>

<h1>Royal Games Dashboard</h1>

<!-- RECENT BOOKINGS -->
<h2>Recent 5 Bookings</h2>
<div class="card scroll-box">
<table>
<thead>
<tr>
<th>Name</th>
<th>Console</th>
<th>Start Date</th>
<th>Final ₹</th>
<th>Coupon</th>
</tr>
</thead>
<tbody id="recentBookings"></tbody>
</table>
</div>

<!-- 10 DAY EARNINGS -->
<h2>Last 10 Days Earnings</h2>
<div class="card">
<button onclick="toggleTenDays()">Show Details</button>
<div id="tenDaysBox" class="hidden"></div>
</div>

<!-- MONTHLY REPORT -->
<h2>Monthly Business Report</h2>
<div class="card" id="monthlyReport"></div>

<!-- AI BRAIN -->
<h2>Royal Games AI Brain 🧠</h2>
<input type="text" id="aiQuestion" placeholder="Ask about growth, profit, upgrade...">
<button onclick="askAI()">Ask</button>
<div class="card" id="aiAnswer"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBRuy9084wz4HwBJbdNuleC4suYi0zycNA",
  authDomain: "royalgamesproject.firebaseapp.com",
  databaseURL: "https://royalgamesproject-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "royalgamesproject",
  storageBucket: "royalgamesproject.firebasestorage.app",
  messagingSenderId: "1008609758558",
  appId: "1:1008609758558:web:7aa12cdef2b066ad7393cf"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

let allBookings=[];

function checkPassword(){
if(document.getElementById('adminPass').value==="YUVRAJ01"){
document.getElementById('loginBox').style.display="none";
loadAll();
}else{
document.getElementById('loginError').innerText="Wrong Password";
}
}

function loadAll(){
db.ref("bookings").once("value",snap=>{
allBookings=[];
snap.forEach(child=>{
allBookings.push(child.val());
});

allBookings.sort((a,b)=>b.timestamp-a.timestamp);

loadRecent();
loadTenDays();
loadMonthly();
});
}

function loadRecent(){
let html="";
let recent=allBookings.slice(0,5);
recent.forEach(b=>{
html+=`
<tr>
<td>${b.name}</td>
<td>${b.console}</td>
<td>${b.startDate}</td>
<td>₹${b.finalPrice}</td>
<td>${b.coupon||"No"}</td>
</tr>`;
});
document.getElementById("recentBookings").innerHTML=html;
}

function toggleTenDays(){
let box=document.getElementById("tenDaysBox");
box.classList.toggle("hidden");
}

function loadTenDays(){
let today=new Date();
let total=0;
let html="<br>";

allBookings.forEach(b=>{
let d=new Date(b.startDate);
let diff=(today-d)/(1000*60*60*24);
if(diff<=10){
total+=Number(b.finalPrice);
html+=`${b.name} - ₹${b.finalPrice}<br>`;
}
});

html+=`<br><b>Total Last 10 Days: ₹${total}</b>`;
document.getElementById("tenDaysBox").innerHTML=html;
}

function loadMonthly(){
let month=new Date().toISOString().slice(0,7);
let total=0;
let totalBooking=0;
let couponCount=0;
let totalDiscount=0;
let noCouponRevenue=0;
let repeatCount={};

allBookings.forEach(b=>{
if(b.startDate.startsWith(month)){
totalBooking++;
total+=Number(b.finalPrice);

if(b.coupon && b.coupon!=="N/A"){
couponCount++;
totalDiscount+=Number(b.discount||0);
}else{
noCouponRevenue+=Number(b.finalPrice);
}

if(repeatCount[b.phone]) repeatCount[b.phone]++;
else repeatCount[b.phone]=1;
}
});

let repeatPeople=0;
for(let p in repeatCount){
if(repeatCount[p]>1) repeatPeople++;
}

document.getElementById("monthlyReport").innerHTML=`
Total Bookings: ${totalBooking}<br>
Total Revenue: ₹${total}<br>
Coupon Used: ${couponCount} times<br>
Total Coupon Discount: ₹${totalDiscount}<br>
Revenue Without Coupon: ₹${noCouponRevenue}<br>
Repeat Customers This Month: ${repeatPeople}
`;
}

function askAI(){
let q=document.getElementById("aiQuestion").value.toLowerCase();
let month=new Date().toISOString().slice(0,7);
let revenue=0;
let bookings=0;

allBookings.forEach(b=>{
if(b.startDate.startsWith(month)){
bookings++;
revenue+=Number(b.finalPrice);
}
});

let avg=bookings? (revenue/bookings).toFixed(2):0;

let reply=`This Month Revenue: ₹${revenue}<br>
Total Bookings: ${bookings}<br>
Average Booking Value: ₹${avg}<br><br>`;

if(q.includes("growth")){
reply+="To grow business increase weekend offers and push repeat customers.";
}
else if(q.includes("upgrade")){
reply+="Upgrade when revenue grows consistently 3 months above current average.";
}
else if(q.includes("profit")){
reply+="Reduce coupon usage slightly to increase net profit.";
}
else{
reply+="Focus on marketing + loyalty rewards.";
}

document.getElementById("aiAnswer").innerHTML=reply;
}

</script>
</body>
</html>

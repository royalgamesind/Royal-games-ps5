<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Intelligence | JARVIS OS</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';
        window.AI_CORE = pipeline;
    </script>

    <style>
        :root { --bg: #010409; --accent: #00d2ff; --neon: #00f2ff; --glass: rgba(10, 25, 47, 0.8); }
        body { background: #010409; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; margin: 0; padding: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(0, 210, 255, 0.1); border-radius: 25px; padding: 25px; }

        /* JARVIS Interface */
        .jarvis-main { grid-column: span 4; text-align: center; padding: 40px; }
        .orb { 
            width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, var(--neon) 0%, transparent 70%);
            box-shadow: 0 0 30px var(--neon); margin: 0 auto 20px; cursor: pointer; position: relative;
        }
        .orb.thinking { animation: shake 0.2s infinite; filter: hue-rotate(180deg); }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }

        .ai-status { font-style: italic; color: var(--accent); margin-bottom: 20px; height: 24px; }
        .cmd-bar { display: flex; gap: 10px; max-width: 600px; margin: 0 auto; }
        input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--accent); border-radius: 12px; color: #fff; padding: 12px; }
        button { background: var(--accent); border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; }

        /* Tables & Stats */
        .stat-box { border-left: 4px solid var(--accent); }
        .stat-val { font-size: 2rem; font-weight: bold; margin-top: 10px; }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; }
        th { text-align: left; color: var(--accent); padding-bottom: 10px; border-bottom: 1px solid #333; }
        td { padding: 12px 0; border-bottom: 1px solid #222; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="grid">
    <div class="card jarvis-main">
        <div id="orb" class="orb" onclick="JARVIS.boot()"></div>
        <div id="aiStatus" class="ai-status">INITIALIZE NEURAL LINK</div>
        <div class="cmd-bar">
            <input type="text" id="aiMsg" placeholder="Talk to JARVIS...">
            <button onclick="JARVIS.handleCommand()">SEND</button>
            <button style="background: #00439c; color: white;" onclick="JARVIS.listen()"><i class="fas fa-microphone"></i></button>
        </div>
    </div>

    <div class="card stat-box">
        <div>Total Revenue</div>
        <div class="stat-val" id="totalRev">₹0</div>
    </div>
    <div class="card stat-box" style="border-color: #0070f3;">
        <div>PS5 Income</div>
        <div class="stat-val" id="psIncome">₹0</div>
    </div>
    <div class="card stat-box" style="border-color: #107c10;">
        <div>Xbox Income</div>
        <div class="stat-val" id="xbIncome">₹0</div>
    </div>
    <div class="card stat-box" style="border-color: #facc15;">
        <div>Memories</div>
        <div class="stat-val" id="memCount">0</div>
    </div>

    <div class="card" style="grid-column: span 2;">
        <h3>Revenue Trend</h3>
        <canvas id="revChart" height="150"></canvas>
    </div>
    <div class="card" style="grid-column: span 2;">
        <h3>Console Split</h3>
        <canvas id="consoleChart" height="150"></canvas>
    </div>

    <div class="card" style="grid-column: span 4;">
        <h3>Recent Transactions</h3>
        <table>
            <thead><tr><th>User</th><th>Console</th><th>Amount</th><th>Date</th></tr></thead>
            <tbody id="logBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 1. FIREBASE SETUP
    const firebaseConfig = {
        databaseURL: "https://royalgamesproject-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. JARVIS ENGINE
    const JARVIS = {
        brain: null,
        isBooted: false,
        memory: JSON.parse(localStorage.getItem('JARVIS_MEM')) || {},

        async boot() {
            const status = document.getElementById("aiStatus");
            const orb = document.getElementById("orb");
            orb.classList.add("thinking");
            status.innerText = "LOADING BRAIN (WebGPU)...";

            try {
                this.brain = await window.AI_CORE('text-generation', 'HuggingFaceTB/SmolLM2-1.7B-Instruct', { device: 'webgpu' });
                this.isBooted = true;
                orb.classList.remove("thinking");
                this.speak("Systems online. I've synced the database, Sir.");
                status.innerText = "JARVIS: Online & Ready.";
                this.updateMemCount();
            } catch (e) {
                status.innerText = "ERROR: Local AI requires WebGPU.";
            }
        },

        async handleCommand(voiceIn = null) {
            if(!this.isBooted) return this.boot();
            const query = voiceIn || document.getElementById("aiMsg").value;
            const orb = document.getElementById("orb");
            const status = document.getElementById("aiStatus");

            orb.classList.add("thinking");
            
            // Memory Learning
            if(query.toLowerCase().includes("remember")) {
                this.memory[`fact_${Date.now()}`] = query.replace("remember", "").trim();
                localStorage.setItem('JARVIS_MEM', JSON.stringify(this.memory));
                this.updateMemCount();
            }

            const context = `Revenue: ${document.getElementById("totalRev").innerText}. Memory: ${JSON.stringify(this.memory)}`;
            const prompt = `<|im_start|>system\nYou are JARVIS, a witty friend. Context: ${context}. Keep it under 25 words.<|im_start|>user\n${query}<|im_end|>\n<|im_start|>assistant`;

            const out = await this.brain(prompt, { max_new_tokens: 50, temperature: 0.7 });
            const response = out[0].generated_text.split('<|im_start|>assistant')[1].trim();

            this.speak(response);
            status.innerText = "JARVIS: " + response;
            orb.classList.remove("thinking");
            document.getElementById("aiMsg").value = "";
        },

        speak(text) {
            const m = new SpeechSynthesisUtterance(text);
            m.pitch = 0.9; window.speechSynthesis.speak(m);
        },

        listen() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.onresult = (e) => this.handleCommand(e.results[0][0].transcript);
            rec.start();
        },

        updateMemCount() {
            document.getElementById("memCount").innerText = Object.keys(this.memory).length;
        }
    };

    // 3. DATA ENGINE (Your Functions)
    let charts = {};
    function sync() {
        db.ref("bookings").on("value", snap => {
            const data = snap.val() || {};
            let stats = { total: 0, ps: 0, xb: 0, daily: {} };
            const body = document.getElementById("logBody");
            body.innerHTML = "";

            Object.values(data).reverse().forEach(b => {
                const p = Number(b.finalPrice || 0);
                stats.total += p;
                if(b.console.includes("PS5")) stats.ps += p; else stats.xb += p;
                stats.daily[b.startDate] = (stats.daily[b.startDate] || 0) + p;
                
                body.innerHTML += `<tr><td>${b.customerName}</td><td>${b.console}</td><td>₹${p}</td><td>${b.startDate}</td></tr>`;
            });

            document.getElementById("totalRev").innerText = "₹" + stats.total;
            document.getElementById("psIncome").innerText = "₹" + stats.ps;
            document.getElementById("xbIncome").innerText = "₹" + stats.xb;
            updateCharts(stats);
        });
    }

    function updateCharts(s) {
        const ctx1 = document.getElementById('revChart').getContext('2d');
        if(charts.rev) charts.rev.destroy();
        charts.rev = new Chart(ctx1, {
            type: 'line',
            data: { labels: Object.keys(s.daily), datasets: [{ label: 'Daily', data: Object.values(s.daily), borderColor: '#00d2ff', tension: 0.4 }] },
            options: { maintainAspectRatio: false }
        });

        const ctx2 = document.getElementById('consoleChart').getContext('2d');
        if(charts.con) charts.con.destroy();
        charts.con = new Chart(ctx2, {
            type: 'doughnut',
            data: { labels: ['PS5', 'Xbox'], datasets: [{ data: [s.ps, s.xb], backgroundColor: ['#0070f3', '#107c10'] }] },
            options: { maintainAspectRatio: false }
        });
    }

    sync();
</script>
</body>
</html>

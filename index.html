<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Games Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:'Roboto',sans-serif;background:#0b0f1a;color:#fff}
.header{background:linear-gradient(90deg,#111827,#1e293b);padding:25px;text-align:center;border-bottom:4px solid gold}
.header h1{margin:0;font-family:'Orbitron';color:gold;letter-spacing:3px}
.section{padding:25px}
.card{background:#111827;border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 0 20px rgba(0,255,255,.1)}
.card:hover{box-shadow:0 0 25px rgba(0,255,255,.3)}
input,button{padding:12px;border-radius:12px;border:none;margin-top:8px}
input{width:95%;background:#1f2937;color:#fff}
button{background:#22c55e;color:#fff;cursor:pointer;font-weight:bold}
button:hover{background:#16a34a}
button.danger{background:#e53935}
#loginBox{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:999}
#loginBox .inner{background:#111827;padding:30px;border-radius:20px;text-align:center}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.gold{color:gold;font-family:'Orbitron'}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="inner">
    <h2 class="gold">Royal Games Admin</h2>
    <input type="password" id="adminPass" placeholder="Enter Admin Password">
    <br><br>
    <button onclick="checkPassword()">Enter Dashboard</button>
    <p id="loginError" style="color:red"></p>
  </div>
</div>

<div class="header">
<h1>👑 ROYAL GAMES ADMIN PANEL</h1>
</div>

<div class="section">

<!-- SUMMARY -->
<h2 class="gold">Business Summary</h2>
<div class="summary-grid">
<div class="card">Total Bookings<br><h2 id="totalBookings">0</h2></div>
<div class="card">Monthly Revenue<br><h2>₹<span id="monthlyRevenue">0</span></h2></div>
<div class="card">Estimated Cost<br><h2>₹<span id="monthlyCost">0</span></h2></div>
<div class="card">Net Profit<br><h2 style="color:#22c55e">₹<span id="monthlyProfit">0</span></h2></div>
</div>

<!-- SEARCH -->
<h2 class="gold">Search Booking</h2>
<input type="text" id="searchBox" placeholder="Enter Name or Booking ID">
<button onclick="searchBooking()">Search</button>
<div id="searchResult"></div>

<!-- BOOKINGS -->
<h2 class="gold">All Bookings</h2>
<div id="bookingList"></div>

<!-- VIP -->
<h2 class="gold">VIP Customers</h2>
<div id="repeatCustomers"></div>

<!-- GRAPHS -->
<h2 class="gold">Bookings Last 10 Days</h2>
<canvas id="bookingChart"></canvas>

<h2 class="gold">Monthly Revenue Graph</h2>
<canvas id="monthlyRevenueChart"></canvas>

<!-- AI -->
<h2 class="gold">Royal AI Brain</h2>
<input type="text" id="aiQuestion" placeholder="Ask about growth, profit, upgrade">
<button onclick="askAI()">Ask AI</button>
<div id="aiAnswer" style="margin-top:15px"></div>

</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyBRuy9084wz4HwBJbdNuleC4suYi0zycNA",
authDomain:"royalgamesproject.firebaseapp.com",
databaseURL:"https://royalgamesproject-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"royalgamesproject",
storageBucket:"royalgamesproject.firebasestorage.app",
messagingSenderId:"1008609758558",
appId:"1:1008609758558:web:7aa12cdef2b066ad7393cf"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();

/* LOGIN */
function checkPassword(){
if(document.getElementById('adminPass').value==='YUVRAJ01'){
document.getElementById('loginBox').style.display='none';
loadAll();
}else{
document.getElementById('loginError').innerText="Wrong Password";
}
}

/* LOAD ALL */
function loadAll(){
loadBookings();
detectCustomers();
bookingGraph();
loadMonthlySummary();
monthlyRevenueGraph();
}

/* BOOKINGS */
function loadBookings(){
db.ref('bookings').on('value',snap=>{
let html='';
snap.forEach(child=>{
let d=child.val();
let id=child.key;
html+=`<div class="card">
<b>ID:</b> ${id}<br>
<b>Name:</b> ${d.name}<br>
<b>Phone:</b> ${d.phone}<br>
<b>Date:</b> ${d.startDate||d.date}<br>
<b>Days:</b> ${d.days||1}<br>
<b>Price:</b> ₹${d.finalPrice||d.price||0}<br><br>
<button class="danger" onclick="cancelBooking('${id}')">Cancel</button>
</div>`;
});
document.getElementById('bookingList').innerHTML=html||"No bookings";
});
}

function cancelBooking(id){
if(confirm("Cancel booking?")){
db.ref('bookings/'+id).remove();
}
}

/* SEARCH */
function searchBooking(){
let val=document.getElementById('searchBox').value.toLowerCase();
db.ref('bookings').once('value',snap=>{
let html='';
snap.forEach(child=>{
let d=child.val();
let id=child.key;
if(id.toLowerCase().includes(val)||d.name.toLowerCase().includes(val)){
html+=`<div class="card">${d.name} - ₹${d.finalPrice||d.price||0}</div>`;
}
});
document.getElementById('searchResult').innerHTML=html||"No booking found";
});
}

/* VIP */
function detectCustomers(){
let customers={};
db.ref('bookings').once('value',snap=>{
snap.forEach(child=>{
let d=child.val();
if(customers[d.phone]) customers[d.phone].count++;
else customers[d.phone]={name:d.name,count:1};
});
let html='';
for(let p in customers){
if(customers[p].count>1){
html+=`<div class="card">${customers[p].name} (${p}) - ${customers[p].count} bookings</div>`;
}
}
document.getElementById('repeatCustomers').innerHTML=html||"No VIP yet";
});
}

/* 10 DAY GRAPH */
function bookingGraph(){
let days={},today=new Date();
for(let i=9;i>=0;i--){
let d=new Date(); d.setDate(today.getDate()-i);
days[d.toLocaleDateString()]=0;
}
db.ref('bookings').once('value',snap=>{
snap.forEach(child=>{
let d=child.val();
let key=new Date(d.startDate||d.date).toLocaleDateString();
if(days[key]!=undefined) days[key]++;
});
new Chart(document.getElementById('bookingChart'),{
type:'line',
data:{labels:Object.keys(days),
datasets:[{label:'Bookings',data:Object.values(days),borderWidth:3}]}
});
});
}

/* MONTHLY SUMMARY */
function loadMonthlySummary(){
let total=0,rev=0,cost=0;
let now=new Date();
db.ref('bookings').once('value',snap=>{
snap.forEach(child=>{
let d=child.val();
total++;
let date=new Date(d.startDate||d.date);
if(date.getMonth()===now.getMonth()){
let price=Number(d.finalPrice||d.price||0);
rev+=price;
cost+=200;
}
});
let profit=rev-cost;
document.getElementById('totalBookings').innerText=total;
document.getElementById('monthlyRevenue').innerText=rev;
document.getElementById('monthlyCost').innerText=cost;
document.getElementById('monthlyProfit').innerText=profit;
});
}

/* MONTHLY GRAPH */
function monthlyRevenueGraph(){
let monthly={};
db.ref('bookings').once('value',snap=>{
snap.forEach(child=>{
let d=child.val();
let date=new Date(d.startDate||d.date);
let key=date.toLocaleString('default',{month:'short'});
let price=Number(d.finalPrice||d.price||0);
if(!monthly[key]) monthly[key]=0;
monthly[key]+=price;
});
new Chart(document.getElementById('monthlyRevenueChart'),{
type:'bar',
data:{labels:Object.keys(monthly),
datasets:[{label:'Revenue',data:Object.values(monthly),borderWidth:2}]}
});
});
}

/* FREE AI */
function askAI(){
let q=document.getElementById('aiQuestion').value.toLowerCase();
db.ref('bookings').once('value',snap=>{
let total=0,rev=0;
snap.forEach(c=>{
total++;
rev+=Number(c.val().finalPrice||c.val().price||0);
});
let avg=(total?rev/total:0).toFixed(2);
let reply=`Total Bookings: ${total}<br>Total Revenue: ₹${rev}<br>Average: ₹${avg}<br><br>`;
if(q.includes("growth")) reply+="Run weekend offers & increase marketing.";
else if(q.includes("profit")) reply+="Increase price slightly or reduce cost.";
else if(q.includes("upgrade")) reply+="Upgrade when 3 months profit stable.";
else reply+="Focus on repeat customers.";
document.getElementById('aiAnswer').innerHTML=reply;
});
}
</script>

</body>
</html>

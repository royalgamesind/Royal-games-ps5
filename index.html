<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS God-Mode | Royal Admin 2.0</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root { --gold: #d4af37; --bg: #030303; --panel: #0d0d0d; --text: #f0f0f0; --danger: #ff4747; }
        body { background: var(--bg); color: var(--text); font-family: 'Orbitron', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* --- GOD-LEVEL LOGIN --- */
        #loginOverlay { position: fixed; inset: 0; background: radial-gradient(circle, #111, #000); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.8s; }
        .login-card { background: #080808; border: 2px solid var(--gold); padding: 50px; border-radius: 30px; text-align: center; box-shadow: 0 0 50px rgba(212, 175, 55, 0.2); }
        .login-card h1 { color: var(--gold); letter-spacing: 5px; margin-bottom: 30px; }
        .login-card input { background: #000; border: 1px solid #333; color: var(--gold); padding: 15px; width: 280px; text-align: center; border-radius: 10px; font-size: 1.2rem; outline: none; transition: 0.3s; }
        .login-card input:focus { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }
        #loginMsg { margin-top: 15px; font-size: 0.9rem; font-weight: bold; min-height: 20px; }

        /* --- DASHBOARD GRID --- */
        .dashboard { display: grid; grid-template-columns: 350px 1fr 1fr 1fr; grid-template-rows: auto auto auto; gap: 20px; padding: 25px; opacity: 0; transform: translateY(20px); transition: 1s ease-out; }
        .card { background: var(--panel); border: 1px solid #222; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        /* JARVIS PANEL */
        .jarvis-sidebar { grid-row: span 3; border: 1px solid var(--gold); display: flex; flex-direction: column; height: 90vh; }
        .orb-box { text-align: center; padding: 20px; border-bottom: 1px solid #222; }
        .orb { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, var(--gold) 20%, transparent 70%); box-shadow: 0 0 30px var(--gold); margin: 0 auto; cursor: pointer; }
        .orb.listening { animation: pulse 1s infinite; background: radial-gradient(circle, #ff0000 20%, transparent 70%); box-shadow: 0 0 30px #ff0000; }
        #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .bubble { padding: 10px 15px; border-radius: 15px; max-width: 85%; font-size: 0.85rem; line-height: 1.4; }
        .ai { align-self: flex-start; background: #1a1a1a; border-left: 3px solid var(--gold); }
        .user { align-self: flex-end; background: var(--gold); color: #000; font-weight: 500; }
        
        /* STATS */
        .stat-card { text-align: center; }
        .stat-card h4 { margin: 0; color: #888; font-size: 0.7rem; text-transform: uppercase; }
        .stat-card .val { font-size: 2.2rem; font-weight: bold; color: var(--gold); margin: 5px 0; }

        /* DATA TABLES */
        .table-area { grid-column: span 3; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: var(--gold); font-size: 0.75rem; padding: 15px; border-bottom: 1px solid #333; }
        td { padding: 15px; border-bottom: 1px solid #111; font-size: 0.85rem; }
        .btn-del { color: var(--danger); background: none; border: 1px solid var(--danger); padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .btn-del:hover { background: var(--danger); color: white; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1>JARVIS AUTH</h1>
        <input type="password" id="passInput" placeholder="Enter Access Code..." onkeydown="if(event.key==='Enter') verify()">
        <div id="loginMsg"></div>
    </div>
</div>

<div class="dashboard" id="mainDash">
    <div class="card jarvis-sidebar">
        <div class="orb-box">
            <div class="orb" id="orb" onclick="startVoice()"></div>
            <p style="color:var(--gold); font-size: 0.6rem; margin-top:10px;">CORE INTEL SYNCED</p>
        </div>
        <div id="chatBox">
            <div class="bubble ai">All systems online, Sir. Awaiting your authorization.</div>
        </div>
        <div style="padding:15px; border-top:1px solid #222; display:flex; gap:5px;">
            <input type="text" id="aiIn" placeholder="Type command..." style="flex:1; background:#000; border:1px solid #333; color:white; padding:8px; border-radius:5px;">
            <button onclick="sendChat()" style="background:var(--gold); border:none; border-radius:5px; padding:0 15px; cursor:pointer;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="card stat-card"><p>TOTAL REVENUE</p><div class="val" id="totalRev">₹0</div></div>
    <div class="card stat-card"><p>PS5 EARNINGS</p><div class="val" style="color:#38bdf8" id="psRev">₹0</div></div>
    <div class="card stat-card"><p>TOTAL BOOKINGS</p><div class="val" style="color:#4ade80" id="totalCount">0</div></div>

    <div class="card table-area">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="color:var(--gold);">Live Database Stream</h3>
            <input type="text" id="search" onkeyup="searchTable()" placeholder="Search bookings..." style="background:#000; border:1px solid #333; color:white; padding:8px; border-radius:5px; width:300px;">
        </div>
        <table>
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Booking ID</th>
                    <th>Console</th>
                    <th>Price</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="dataTable"></tbody>
        </table>
    </div>

    <div class="card span-3" style="grid-column: span 3;">
        <canvas id="revChart" style="height: 250px;"></canvas>
    </div>
</div>

<script>
    // 🔥 UPDATE YOUR CONFIG HERE
    const firebaseConfig = { databaseURL: "https://royalgamesproject-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. FIXED LOGIN LOGIC
    function verify() {
        const input = document.getElementById("passInput");
        const msg = document.getElementById("loginMsg");
        
        // Change "1234" to your preferred password
        if (input.value === "Royal@2026") {
            msg.style.color = "#4ade80";
            msg.innerText = "ACCESS GRANTED. BOOTING SYSTEMS...";
            setTimeout(() => {
                document.getElementById("loginOverlay").style.opacity = "0";
                setTimeout(() => document.getElementById("loginOverlay").style.display = "none", 800);
                document.getElementById("mainDash").style.opacity = "1";
                document.getElementById("mainDash").style.transform = "translateY(0)";
                speak("Access granted. Welcome back, Sir.");
                initData();
            }, 1000);
        } else {
            msg.style.color = "var(--danger)";
            msg.innerText = "ACCESS DENIED. INCORRECT PROTOCOL.";
            input.value = "";
            input.style.borderColor = "var(--danger)";
            speak("Incorrect password, Sir. Access is denied.");
            setTimeout(() => { input.style.borderColor = "#333"; }, 1000);
        }
    }

    // 2. JARVIS AI (CHAT & VOICE)
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    function startVoice() {
        document.getElementById("orb").classList.add("listening");
        recognition.start();
    }
    recognition.onresult = (e) => {
        processJARVIS(e.results[0][0].transcript);
        document.getElementById("orb").classList.remove("listening");
    };

    function sendChat() {
        const input = document.getElementById("aiIn");
        if(input.value) { processJARVIS(input.value); input.value = ""; }
    }

    function processJARVIS(query) {
        const box = document.getElementById("chatBox");
        box.innerHTML += `<div class="bubble user">${query}</div>`;
        
        let response = "I am monitoring all systems, Sir.";
        if(query.toLowerCase().includes("revenue")) response = `Total revenue is ${document.getElementById("totalRev").innerText}.`;
        else if(query.toLowerCase().includes("delete")) response = "Sir, please use the red delete buttons in the table to purge records.";
        
        setTimeout(() => {
            box.innerHTML += `<div class="bubble ai">${response}</div>`;
            box.scrollTop = box.scrollHeight;
            speak(response);
        }, 600);
    }

    function speak(txt) {
        const m = new SpeechSynthesisUtterance(txt);
        m.rate = 1; m.pitch = 0.9;
        window.speechSynthesis.speak(m);
    }

    // 3. DATABASE FUNCTIONS
    function initData() {
        db.ref("bookings").on("value", snap => {
            const data = snap.val() || {};
            const table = document.getElementById("dataTable");
            let total = 0, ps = 0, count = 0;
            table.innerHTML = "";

            Object.entries(data).reverse().forEach(([id, b]) => {
                total += Number(b.finalPrice || 0);
                if(b.console.includes("PS5")) ps += Number(b.finalPrice || 0);
                count++;

                table.innerHTML += `
                    <tr>
                        <td style="font-weight:bold">${b.customerName}</td>
                        <td style="font-family:monospace; color:#666">${id}</td>
                        <td>${b.console}</td>
                        <td style="color:var(--gold); font-weight:bold">₹${b.finalPrice}</td>
                        <td>${b.startDate}</td>
                        <td><button class="btn-del" onclick="deleteEntry('${id}')">DELETE</button></td>
                    </tr>`;
            });

            document.getElementById("totalRev").innerText = "₹" + total;
            document.getElementById("psRev").innerText = "₹" + ps;
            document.getElementById("totalCount").innerText = count;
        });
    }

    function deleteEntry(id) {
        if(confirm("JARVIS: Are you sure you want to erase this data?")) {
            db.ref("bookings").child(id).remove().then(() => speak("Record purged."));
        }
    }

    function searchTable() {
        let val = document.getElementById("search").value.toLowerCase();
        document.querySelectorAll("#dataTable tr").forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(val) ? "" : "none";
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Games Winner Envelope 💌</title>
<style>
/* Background */
body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(120deg, #0b0b0f, #1a1a24);
  font-family: 'Arial', sans-serif;
  color: #fff;
  overflow: hidden;
}

/* Title */
h1 { margin-bottom: 10px; text-align:center; }

/* Input & Button */
input, button {
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: none;
  font-weight: bold;
}

button {
  cursor: pointer;
  background: #ff4500;
  color: #fff;
}

/* Envelope */
#envelope {
  width: 250px;
  height: 150px;
  background: #fff;
  border-radius: 12px;
  position: relative;
  cursor: pointer;
  margin-top: 20px;
  perspective: 1000px;
  display: none;
}

/* Flap */
#flap {
  width: 250px;
  height: 75px;
  background: #fff;
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top;
  transition: transform 0.8s;
  z-index: 2;
}

/* Letter */
#letter {
  position: absolute;
  top: 75px;
  left: 0;
  width: 100%;
  height: 75px;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  color: #000;
  transform: translateY(-100%);
  transition: transform 0.8s;
  text-align: center;
  padding: 5px;
}

/* Envelope Open Animation */
.envelope-open #flap {
  transform: rotateX(-180deg);
}
.envelope-open #letter {
  transform: translateY(0);
}

/* Confetti */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #ff0;
  animation: fall 1.5s linear forwards;
  opacity: 0.9;
  border-radius: 50%;
}
@keyframes fall {
  0% {transform: translateY(0) rotate(0deg);}
  100% {transform: translateY(300px) rotate(720deg); opacity: 0;}
}
</style>
</head>
<body>

<h1>🎮 Royal Games Winner Envelope 💌</h1>
<p>Enter your winner password:</p>
<input type="text" id="winnerCode" placeholder="Enter password">
<button onclick="checkCode()">Open Envelope</button>

<div id="envelope">
  <div id="flap"></div>
  <div id="letter"></div>
</div>

<script>
// Winner data
const winners = {
  "WINNER10": { prize:"🥇 1 Day PS5 Rental FREE", code:"CONGRATS100" },
  "WINNER02": { prize:"🥈 50% OFF", code:"CONGRATS50" },
  "WINNER45": { prize:"🥉 40% OFF", code:"CONGRATS40" }
};

function checkCode() {
  const code = document.getElementById('winnerCode').value.trim().toUpperCase();
  const envelope = document.getElementById('envelope');
  const letter = document.getElementById('letter');

  if(winners[code]){
    const winner = winners[code];
    letter.innerHTML = `${winner.prize}<br>Coupon: ${winner.code}<br>Valid for 1-day rental only`;
    envelope.style.display = "block";
    envelope.classList.remove("envelope-open"); // reset if re-entered
    setTimeout(()=> envelope.classList.add("envelope-open"), 100); // flap open animation
    createConfetti();
  } else {
    alert("❌ Invalid password! This page is only for winners.");
  }
}

// Create confetti
function createConfetti(){
  for(let i=0;i<30;i++){
    const conf = document.createElement('div');
    conf.classList.add('confetti');
    conf.style.background = randomColor();
    conf.style.left = Math.random()*window.innerWidth + "px";
    conf.style.top = "0px";
    conf.style.width = conf.style.height = Math.random()*8 + 5 + "px";
    document.body.appendChild(conf);
    setTimeout(()=> conf.remove(),1500);
  }
}

function randomColor(){
  const colors = ['#ff0','#ff4500','#00f','#0ff','#f0f','#0f0'];
  return colors[Math.floor(Math.random()*colors.length)];
}
</script>

</body>
</html>

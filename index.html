<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Royal Games Admin Panel</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;margin:0;padding:20px}
  h1,h2{margin-top:25px}
  .card{background:#1e1e1e;padding:12px;border-radius:12px;margin:10px 0}
  input,button{border-radius:8px;border:1px solid #444}
  input{padding:10px;background:#222;color:#fff}
  button{padding:10px 14px;background:#4CAF50;color:#fff;border:none;cursor:pointer}
  button.danger{background:#e53935}
  #loginBox{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
  #loginBox .inner{background:#1e1e1e;padding:25px;border-radius:14px;text-align:center}
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="loginBox">
  <div class="inner">
    <h2>Admin Login</h2>
    <input type="password" id="adminPass" placeholder="Enter Password" />
    <br/><br/>
    <button onclick="checkPassword()">Enter</button>
    <p id="loginError" style="color:#ff5252"></p>
  </div>
</div>

<h1>Royal Games Booking Dashboard</h1>

<!-- SEARCH -->
<h2>Check Booking</h2>
<input type="text" id="searchBox" placeholder="Enter Name or Booking ID" />
<button onclick="searchBooking()">Search</button>
<div id="searchResult"></div>

<!-- ALL BOOKINGS -->
<h2>All Bookings</h2>
<div id="bookingList"></div>

<!-- REPEAT CUSTOMERS -->
<h2>Repeat Customers (VIP)</h2>
<div id="repeatCustomers"></div>

<!-- GRAPH -->
<h2>Bookings Last 10 Days</h2>
<canvas id="bookingChart" style="max-width:700px"></canvas>

<!-- ✅ AI SECTION ADDED (ONLY THIS PART NEW) -->
<h2>Royal Games AI Brain</h2>
<input type="text" id="aiQuestion" placeholder="Ask about growth, profit, marketing, upgrade" />
<button onclick="askAI()">Ask AI</button>
<div id="aiAnswer" style="margin-top:15px"></div>

<script>

/************* YOUR FIREBASE CONFIG *************/
const firebaseConfig = {
  apiKey: "AIzaSyBRuy9084wz4HwBJbdNuleC4suYi0zycNA",
  authDomain: "royalgamesproject.firebaseapp.com",
  databaseURL: "https://royalgamesproject-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "royalgamesproject",
  storageBucket: "royalgamesproject.firebasestorage.app",
  messagingSenderId: "1008609758558",
  appId: "1:1008609758558:web:7aa12cdef2b066ad7393cf"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

/******** PASSWORD ********/
function checkPassword(){
  const pass = document.getElementById('adminPass').value;
  if(pass === 'YUVRAJ01'){
    document.getElementById('loginBox').style.display='none';
    loadBookings();
    detectCustomers();
    bookingGraph();
  }else{
    document.getElementById('loginError').innerText='Wrong Password';
  }
}

/******** LOAD BOOKINGS ********/
function loadBookings(){
  db.ref('bookings').on('value',snap=>{
    let html='';
    snap.forEach(child=>{
      let data=child.val();
      let id=child.key;

      html += `
      <div class="card">
        <b>ID:</b> ${id}<br>
        <b>Name:</b> ${data.name}<br>
        <b>Phone:</b> ${data.phone}<br>
        <b>Date:</b> ${data.date}<br>
        <b>Time:</b> ${data.time}<br>
        <b>Price:</b> ₹${data.price}<br><br>
        <button class="danger" onclick="cancelBooking('${id}')">Cancel Booking</button>
      </div>`;
    });
    document.getElementById('bookingList').innerHTML = html || '<p>No bookings yet</p>';
  });
}

/******** CANCEL BOOKING ********/
function cancelBooking(id){
  if(confirm('Cancel this booking?')){
    db.ref('bookings/'+id).remove();
    alert('Booking Cancelled');
  }
}

/******** SEARCH ********/
function searchBooking(){
  const value=document.getElementById('searchBox').value.toLowerCase();
  const resultDiv=document.getElementById('searchResult');
  resultDiv.innerHTML='Searching...';

  db.ref('bookings').once('value',snapshot=>{
    let found=false; let html='';
    snapshot.forEach(child=>{
      const data=child.val();
      const id=child.key;
      if(id.toLowerCase().includes(value)||data.name.toLowerCase().includes(value)){
        found=true;
        html+=`<div class="card">
        <b>ID:</b> ${id}<br>
        <b>Name:</b> ${data.name}<br>
        <b>Phone:</b> ${data.phone}<br>
        <b>Date:</b> ${data.date}<br>
        <b>Time:</b> ${data.time}<br>
        <b>Price:</b> ₹${data.price}
        </div>`;
      }
    });
    resultDiv.innerHTML = found?html:'<span style="color:red">No booking found</span>';
  });
}

/******** REPEAT CUSTOMER DETECTOR ********/
function detectCustomers(){
  let customers={};
  db.ref('bookings').once('value',snapshot=>{
    snapshot.forEach(child=>{
      let d=child.val();
      if(customers[d.phone]) customers[d.phone].count++;
      else customers[d.phone]={name:d.name,count:1};
    });
    let html='';
    for(let p in customers){
      if(customers[p].count>1){
        html+=`<div class="card">${customers[p].name} (${p})<br>Bookings: ${customers[p].count}</div>`;
      }
    }
    document.getElementById('repeatCustomers').innerHTML=html||'<p>No repeat customers yet</p>';
  });
}

/******** GRAPH (FIXED TYPO) ********/
function bookingGraph(){
  let days={};
  let today=new Date();
  for(let i=9;i>=0;i--){
    let d=new Date();
    d.setDate(today.getDate()-i);
    let key=d.toLocaleDateString();
    days[key]=0;
  }

  db.ref('bookings').once('value',snapshot=>{
    snapshot.forEach(child=>{
      let data=child.val();
      if(days[data.date]!==undefined) days[data.date]++;
    });

    new Chart(document.getElementById('bookingChart'),{
      type:'line',
      data:{
        labels:Object.keys(days),
        datasets:[{label:'Bookings',data:Object.values(days),borderWidth:3}]
      }
    });
  });
}

/******** ✅ SMART FREE AI ********/
function askAI(){
const question=document.getElementById('aiQuestion').value.toLowerCase();
const answerDiv=document.getElementById('aiAnswer');
answerDiv.innerHTML="Analyzing...";

db.ref('bookings').once('value',snapshot=>{

let totalBookings=0;
let totalRevenue=0;

snapshot.forEach(child=>{
let d=child.val();
totalBookings++;
totalRevenue+=Number(d.price||0);
});

let avg=totalBookings? (totalRevenue/totalBookings).toFixed(2):0;

let reply=`Total Bookings: ${totalBookings}<br>
Total Revenue: ₹${totalRevenue}<br>
Average Booking Value: ₹${avg}<br><br>`;

if(question.includes("growth")){
reply+="Focus on increasing daily bookings using offers.";
}
else if(question.includes("profit")){
reply+="Increase price slightly or reduce expenses to grow profit.";
}
else if(question.includes("upgrade")){
reply+="Upgrade when revenue stays high for 2-3 months continuously.";
}
else{
reply+="Improve repeat customers and run weekend promotions.";
}

answerDiv.innerHTML=reply;

});
}

</script>
</body>
</html>
